name: Deploy

# Cada tag "v*" cria uma GitHub Release NOVA e distinta — releases antigas
# nunca sao sobrescritas/apagadas, entao o historico de deploys anteriores
# fica preservado automaticamente na aba Releases do repositorio.
on:
  push:
    tags:
      - "v*"

env:
  GODOT_VERSION: 4.7.1

jobs:
  export-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Export e publicar (Windows)
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: export game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          presets_to_export: Windows Desktop

      - name: create release
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
